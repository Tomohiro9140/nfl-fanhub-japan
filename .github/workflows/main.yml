name: NFL Data Auto Update

on:
  schedule:
    # 毎日 日本時間 午前3時 (協定世界時 18:00)
    - cron: '0 18 * * *'
    # 毎日 日本時間 午前10時 (試合結果・ニュース更新用 01:00)
    - cron: '0 1 * * *'
    # 毎日 日本時間 午後6時 (夕方更新用 09:00)
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリの読み込み
        uses: actions/checkout@v4

      - name: pnpmのセットアップ
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 依存パッケージのインストール
        run: pnpm install --no-frozen-lockfile

      - name: データ取得処理の実行
        run: |
          pnpm run build || pnpm run check || node scripts/*.js || true

      - name: 最新データをGitHubに保存して反映
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "chore: 自動データ更新 [skip ci]" && git push)
