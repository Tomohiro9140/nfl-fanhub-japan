name: NFL Data Auto Update

on:
  schedule:
    # 毎日 日本時間 午前3時 (協定世界時 18:00)
    - cron: '0 18 * * *'
    # 毎日 日本時間 午前10時 (試合結果・ニュース更新用 01:00)
    - cron: '0 1 * * *'
    # 毎日 日本時間 午後6時 (夕方更新用 09:00)
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: リポジトリの読み込み
        uses: actions/checkout@v4

      - name: pnpmのセットアップ
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 依存パッケージのインストール
        run: pnpm install --no-frozen-lockfile

      - name: データベースのテーブル（棚）作成
        run: |
          pnpm run db:push || true

      - name: NFL最新データの取得スクリプトを実行
        run: |
          node scripts/syncAllLeagueSchedules.mjs || true
          node scripts/refreshOfficialLeagueDashboard.mjs || true
          node scripts/refreshOfficialTeamData.mjs || true
          node scripts/refreshOfficialTeamFeed.mjs || true
          node scripts/refreshPftAvailability.mjs || true
          node scripts/generateJapaneseNewsSummary.mjs || true

      - name: 最新データをGitHubに保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "chore: 自動データ更新 [skip ci]" && git push)
