name: NFL Data Auto Update

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: リポジトリの読み込み
        uses: actions/checkout@v4

      - name: pnpmのセットアップ
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 依存パッケージのインストール
        run: pnpm install --no-frozen-lockfile

      - name: APIサーバーの完全合体ビルド
        run: |
          mkdir -p api
          pnpm exec esbuild server/api.ts --platform=node --packages=external --bundle --format=esm --outfile=api/index.js

      - name: データベースのテーブル作成
        run: |
          pnpm run db:push || true

      - name: NFL最新データの取得スクリプトを実行
        run: |
          npx tsx -e 'await import("./scripts/syncAllLeagueSchedules.mjs"); process.exit(0);'
          npx tsx -e 'await import("./scripts/refreshOfficialLeagueDashboard.mjs"); process.exit(0);'
          npx tsx -e 'await import("./scripts/refreshOfficialTeamData.mjs"); process.exit(0);'
          npx tsx -e 'await import("./scripts/refreshOfficialTeamFeed.mjs"); process.exit(0);'
          npx tsx -e 'await import("./scripts/refreshPftAvailability.mjs"); process.exit(0);'
          npx tsx -e 'await import("./scripts/generateJapaneseNewsSummary.mjs"); process.exit(0);' || true

      - name: 生成ファイルと最新データをGitHubに保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add api/index.js
          git add -A
          git diff --staged --quiet || (git commit -m "chore: API完全ビルドとデータ同期" && git push)
