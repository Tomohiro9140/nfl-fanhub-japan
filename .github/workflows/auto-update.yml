name: NFL Data Auto Update

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: リポジトリの読み込み
        uses: actions/checkout@v4

      - name: pnpmのセットアップ
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 依存パッケージのインストール
        run: pnpm install --no-frozen-lockfile

      - name: APIサーバーの完全合体ビルド
        run: |
          mkdir -p api
          pnpm exec esbuild server/api.ts --platform=node --packages=external --bundle --format=esm --outfile=api/index.js

      - name: データベースのテーブル作成
        run: |
          pnpm run db:push || true

      - name: NFL最新データの取得スクリプトを実行
        run: |
          # 1. 全463試合の日程更新
          npx tsx -e 'import("./scripts/syncAllLeagueSchedules.mjs").then(() => process.exit(0)).catch(e => { console.error(e); process.exit(1); })'

          # 2. リーグ順位・最新スコア・ハイライト更新
          npx tsx -e 'import("./scripts/refreshOfficialLeagueDashboard.mjs").then(() => process.exit(0)).catch(e => { console.error(e); process.exit(1); })'

          # 3. 全32チームの公式ロスター更新
          npx tsx -e '
            import("./server/officialTeamData.ts").then(async m => {
              const teams = ["ARI","ATL","BAL","BUF","CAR","CHI","CIN","CLE","DAL","DEN","DET","GB","HOU","IND","JAX","KC","LV","LAC","LAR","MIA","MIN","NE","NO","NYG","NYJ","PHI","PIT","SF","SEA","TB","TEN","WAS"];
              for (const t of teams) {
                try { await m.refreshOfficialTeamData(t); } catch(err) { console.error("Roster error for " + t, err); }
              }
              process.exit(0);
            }).catch(e => { console.error(e); process.exit(1); });
          '

          # 4. 全32チームの公式ニュース・RSS・負傷者情報更新
          npx tsx -e '
            import("./server/officialFeeds.ts").then(async m => {
              const teams = ["ARI","ATL","BAL","BUF","CAR","CHI","CIN","CLE","DAL","DEN","DET","GB","HOU","IND","JAX","KC","LV","LAC","LAR","MIA","MIN","NE","NO","NYG","NYJ","PHI","PIT","SF","SEA","TB","TEN","WAS"];
              for (const t of teams) {
                try { await m.refreshOfficialTeamFeed(t); } catch(err) { console.error("Feed error for " + t, err); }
              }
              process.exit(0);
            }).catch(e => { console.error(e); process.exit(1); });
          '

          # 5. PFT出場可否・移籍情報（Status Radar）更新
          npx tsx -e 'import("./scripts/refreshPftAvailability.mjs").then(() => process.exit(0)).catch(e => { console.error(e); process.exit(1); })'

      - name: 生成ファイルと最新データをGitHubに保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add api/index.js
          git add -A
          git diff --staged --quiet || (git commit -m "chore: API完全ビルドとデータ同期" && git push)
