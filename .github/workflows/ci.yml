name: CI

# PR を作ったとき・更新したときに、型チェックとビルドが通るかを確認する
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリの読み込み
        uses: actions/checkout@v4

      # pnpm のバージョンは package.json の packageManager に揃える
      - name: pnpmのセットアップ
        uses: pnpm/action-setup@v3

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 依存パッケージのインストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm check

      - name: ビルド
        run: pnpm build
