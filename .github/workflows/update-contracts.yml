name: Update NFL Contracts Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 2'

jobs:
  update-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run contracts generator
        run: |
          node scripts/generate_contracts.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add server/data/active_contracts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update NFL contracts via Over The Cap / NFLverse [skip ci]" && git push origin main)
